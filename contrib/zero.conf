# zero.conf -- example configuration for zerod
#
# Copy to the data directory: ~/.zero/zero.conf (Linux),
# ~/Library/Application Support/zero/zero.conf (macOS), %APPDATA%\zero\zero.conf (Windows).
# An empty file is valid: every option has a built-in default.
# Each line below is commented out and shows the default; uncomment a line to change one setting.
# Command-line options (-name=value) override this file. Never put reindex= here: use
# zerod -reindex once on the command line.
# contrib/zero-conf.sh writes ready-made files for common roles from contrib/conf-templates/.

# --- Network ---
#port=23801                 # P2P port (testnet 23802, regtest 23803)
#listen=1                   # accept inbound peers (default 1 unless proxy= or connect= is set)
#maxconnections=125
#addnode=<ip:port>          # add a peer and keep the connection; repeatable
#connect=<ip:port>          # connect only to these peers; repeatable
#externalip=<ip>            # public address announced to peers
#proxy=127.0.0.1:9050       # SOCKS5 proxy, for example Tor
#onlynet=<net>              # ipv4, ipv6, or onion; repeatable
#dnsseed=1                  # default 1 unless connect= is set

# --- RPC server ---
#server=1                   # zerod accepts JSON-RPC by default
#rpcport=23811              # testnet 23812, regtest 23813
#rpcuser=<user>             # without rpcuser and rpcpassword, zero-cli authenticates
#rpcpassword=<password>     #   with the .cookie file in the data directory
#rpcbind=127.0.0.1          # listen address; repeatable; used only together with rpcallowip
#rpcallowip=127.0.0.1       # allowed client address or network; repeatable; default loopback only
#rpcthreads=4               # threads serving RPC calls
#rpcworkqueue=16            # queued calls; when full, HTTP 503
#rpcservertimeout=30        # seconds before an idle HTTP connection closes
#rpcasyncthreads=1          # workers for asynchronous operations (z_sendmany and similar)
#rpcdatacontinue=20         # seconds between getalldata results; 0 disables the time gate
#rest=0                     # unauthenticated REST interface

# --- Wallet ---
#disablewallet=0
#deletetx=0                 # delete old spent transactions from wallet.zero; history RPCs read the archive
#keeptxnum=200              # with deletetx: keep the last n transactions
#keeptxfornblocks=10000     # with deletetx: keep transactions for at least n blocks
#deleteinterval=1000        # with deletetx: delete every n blocks during initial sync
#consolidation=0            # automatic Sapling note consolidation
#consolidationtxfee=0       # fee in zatoshis for consolidation transactions
#consolidatesaplingaddress=<zaddr>   # default: all Sapling addresses; repeatable

# --- Indexes and explorers ---
#insightexplorer=0          # address, spent, and timestamp indexes for Insight; changing it forces a reindex
#experimentalfeatures=0     # required by the index RPCs, z_mergetoaddress, payment disclosure, wallet encryption
# txindex is always on in zerod; a txindex= line has no effect.

# --- Performance ---
#dbcache=800                # database cache in MiB (4 to 16384)

# --- Mining ---
#gen=0                      # mine with this node
#genproclimit=1             # mining threads; -1 uses all cores
#equihashsolver=default     # solver when gen=1: default or tromp
#mineraddress=<taddr>       # send mined coins to this address

# --- Zeronode ---
#zeronode=0                 # run as a zeronode; needs the wallet and zeronode.conf
#zeronodeprivkey=<key>      # from zero-cli createzeronodekey
#zeronodeaddr=<ip>:23801    # address announced to peers; mainnet zeronodes must use port 23801
#znconf=zeronode.conf

# --- Notifications ---
#zmqpubhashblock=tcp://127.0.0.1:28332
#zmqpubrawtx=tcp://127.0.0.1:28332
#alertnotify=<cmd>          # %s = message; runs only in builds with ENABLE_SYSTEM_COMMAND
#blocknotify=<cmd>          # %s = block hash; same build condition
#walletnotify=<cmd>         # %s = txid; same build condition

# --- Logging ---
#debug=0                    # category, or 1 for all categories
#showmetrics=1              # metrics screen when running in a console
#printtoconsole=0
