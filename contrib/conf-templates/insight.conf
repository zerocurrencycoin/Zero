# insight -- explorer-style zerod. Do not put reindex= in this file.
# Index must have been built with these flags. Source: insight/config/zero.conf (redacted).
server=1
rpcuser=@RPCUSER@
rpcpassword=@RPCPASSWORD@
rpcport=@RPCPORT@
port=23801
txindex=1
insightexplorer=1
experimentalfeatures=1
rpcworkqueue=1024
zmqpubrawtx=tcp://127.0.0.1:28332
zmqpubhashblock=tcp://127.0.0.1:28332
rpcallowip=127.0.0.1
uacomment=bitcore
showmetrics=0
disablewallet=1

