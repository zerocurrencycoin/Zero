# prod -- default. Production operator action (wallet RPC, gen=0).
# Sources: contrib/zero.conf ports + debian example. Do not copy stale addnode IPs.
# Default write: /tmp/zero.conf via contrib/zero-conf.sh
server=1
rpcuser=@RPCUSER@
rpcpassword=@RPCPASSWORD@
rpcport=@RPCPORT@
gen=0
genproclimit=1
equihashsolver=tromp

